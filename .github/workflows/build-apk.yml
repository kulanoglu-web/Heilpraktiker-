name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projekt erzeugen
        run: flutter create --platforms=android --project-name hp_psych_trainer --org de.hptrainer .

      - name: Feste Signatur verwenden (damit Updates installierbar bleiben)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: APK bauen
        run: flutter build apk --release

      - name: APK als Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: HP Trainer APK (neuester Stand)
          body: Direkt auf dem Handy herunterladen und installieren (unbekannte Quellen erlauben).
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
