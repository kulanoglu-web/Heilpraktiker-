name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projekt erzeugen
        run: flutter create --platforms=android --project-name hp_psych_trainer --org de.hptrainer .

      - name: Feste Signatur verwenden (damit Updates installierbar bleiben)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: APK bauen
        run: |
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk HP-Trainer-v1.0.${{ github.run_number }}.apk

      - name: APK als Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HP Trainer Version 1.0.${{ github.run_number }}
          body: Direkt auf dem Handy herunterladen und installieren (unbekannte Quellen erlauben).
          files: HP-Trainer-v1.0.${{ github.run_number }}.apk
          make_latest: true
