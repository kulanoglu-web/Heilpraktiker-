name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projekt erzeugen
        run: |
          flutter create --platforms=android --project-name hp_psych_trainer --org de.hptrainer .
          python3 ci/verify_offline.py

      - name: Android-Lint-Kompatibilität herstellen
        run: |
          cp ci/lint-workaround.gradle android/lint-workaround.gradle
          python3 -c 'from pathlib import Path; p = Path("android/build.gradle.kts"); p.write_text("apply(from = \"lint-workaround.gradle\")\n" + p.read_text())'

      - name: Feste Signatur einrichten (damit Updates installierbar bleiben)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          if [ -f android/app/build.gradle.kts ]; then
            cat signing/append.gradle.kts >> android/app/build.gradle.kts
          else
            cat signing/append.gradle >> android/app/build.gradle
          fi

      - run: flutter pub get

      - name: Lerninhalte und Anwendung prüfen
        run: |
          flutter analyze lib test/catalog_test.dart test/catalog_widget_test.dart --no-fatal-infos --no-fatal-warnings
          flutter test test/catalog_test.dart test/catalog_widget_test.dart

      - name: APK bauen
        run: |
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}
          APK_ANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/apkanalyzer' -type f | head -n 1)
          "$APK_ANALYZER" manifest permissions build/app/outputs/flutter-apk/app-release.apk > apk-permissions.txt
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' apk-permissions.txt; then
            echo 'FEHLER: Release-APK enthält Netzwerkberechtigungen'
            exit 1
          fi
          keytool -exportcert -keystore signing/debug.keystore -storepass android -alias androiddebugkey -file our.der
          python3 -c "import sys;a=open('build/app/outputs/flutter-apk/app-release.apk','rb').read();c=open('our.der','rb').read();sys.exit(0 if c in a else 1)" || { echo 'FEHLER: APK nicht mit festem Schlüssel signiert'; exit 1; }
          cp build/app/outputs/flutter-apk/app-release.apk HP-Trainer-v1.0.${{ github.run_number }}.apk

      - name: APK als Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HP Trainer Version 1.0.${{ github.run_number }}
          body: |
            Vollständig offline: keine externen Links oder Quellenansichten.
            80 neue Auswahlfragen, 40 Lernkarten und 10 mündliche Fälle
            zu Psychopharmaka und somatischer Differenzialdiagnostik.
            Gesamt: 794 Auswahlfragen, 512 Lernkarten, 100 Fälle.
            Neue Lernkapitel zu Wirkstoffgruppen, Nebenwirkungen,
            Schilddrüse, Stoffwechsel, Herz, Atmung und Neurologie.
            Analyse, Inhalts- und Oberflächentests vor dem APK-Build.
          files: HP-Trainer-v1.0.${{ github.run_number }}.apk
          make_latest: true
